# Local monitoring stack without Kubernetes:  docker compose up --build
services:
  api:
    build: .
    image: heart-risk-api:1.0.0
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana-compose-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/grafana-compose-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ./k8s/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
